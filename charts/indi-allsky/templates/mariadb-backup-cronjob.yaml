{{- include "indi-allsky.validateValues" . -}}
{{- if and .Values.mariadb.enabled .Values.mariadb.backup.enabled -}}
{{- $appUid := include "indi-allsky.appUid" . | int -}}
{{- $dataMountPath := include "indi-allsky.dataMountPath" . -}}
{{- $stateMountPath := dir (include "indi-allsky.overlaySentinelPath" .) | trimSuffix "/" -}}
{{- $stateSubPath := trimPrefix (printf "%s/" $dataMountPath) $stateMountPath -}}
{{- $startingDeadlineSeconds := 900 -}}
{{- $successfulJobsHistoryLimit := 3 -}}
{{- $failedJobsHistoryLimit := 3 -}}
{{- $backoffLimit := 2 -}}
{{- $activeDeadlineSeconds := 3600 -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "indi-allsky.backupCronJobName" . }}
  labels:
    {{- include "indi-allsky.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.mariadb.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ $successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $backoffLimit }}
      activeDeadlineSeconds: {{ $activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "indi-allsky.componentLabels" (dict "ctx" . "component" "mariadb-backup") | nindent 12 }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ $appUid }}
            runAsGroup: {{ $appUid }}
            fsGroup: {{ $appUid }}
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: dump
              {{- /*
              The chart's own web image, not the mariadb image. The dump now
              runs inside the shared advisory lock (#16) and publishes through
              the same no-clobber primitive as the pre-migration dump (#22),
              and both of those live in scripts this repo ships, lints and
              tests. The web image already carries mariadb-client for exactly
              this reason. An inline copy of the same logic here would be a
              second implementation of the safety property, free to drift.
              */}}
              image: {{ include "indi-allsky.image" (dict "ctx" . "name" "web") | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- include "indi-allsky.restrictedSecurityContext" . | nindent 16 }}
              command: ["/home/allsky/db-maintenance-lock.sh"]
              args: ["--", "/home/allsky/scheduled-backup.sh"]
              env:
                {{- /* Explicit and minimal, and named exactly as the migration
                       path names them so the lock is taken on the same endpoint
                       the dump then reads. */}}
                - name: INDIALLSKY_MARIADB_HOST
                  value: {{ include "indi-allsky.dbHost" . | quote }}
                - name: INDIALLSKY_MARIADB_PORT
                  value: {{ include "indi-allsky.mariadbPort" . | quote }}
                - name: INDIALLSKY_MARIADB_SSL
                  value: "false"
                - name: MARIADB_USER
                  value: {{ .Values.mariadb.username | quote }}
                - name: MARIADB_DATABASE
                  value: {{ .Values.mariadb.database | quote }}
                - name: MARIADB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "indi-allsky.envSecretName" . }}
                      key: MARIADB_PASSWORD
                - name: INDIALLSKY_BACKUP_DIR
                  value: {{ include "indi-allsky.backupPath" . | quote }}
                - name: INDIALLSKY_BACKUP_RETENTION_DAYS
                  value: {{ .Values.mariadb.backup.retentionDays | quote }}
              volumeMounts:
                {{- /* The .state sibling only. This Job writes dumps; it has no
                       business reading the image tree or the web docroot. */}}
                - name: data
                  mountPath: {{ $stateMountPath }}
                  subPath: {{ $stateSubPath }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "indi-allsky.dataPvcName" . }}
{{- end }}
