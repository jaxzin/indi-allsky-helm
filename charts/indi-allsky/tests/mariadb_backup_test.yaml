suite: verified scheduled MariaDB backup CronJob
values:
  - a5-values.yaml
templates:
  - mariadb-backup-cronjob.yaml
release:
  name: test-release
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments: {count: 0}

  - it: renders only in internal mode with explicit scheduling policy
    set:
      mariadb.backup.enabled: true
      mariadb.backup.schedule: "17 3 * * *"
    asserts:
      - equal: {path: metadata.name, value: test-release-indi-allsky-db-backup}
      - equal: {path: spec.schedule, value: "17 3 * * *"}
      - equal: {path: spec.concurrencyPolicy, value: Forbid}
      - equal: {path: spec.startingDeadlineSeconds, value: 900}
      - equal: {path: spec.successfulJobsHistoryLimit, value: 3}
      - equal: {path: spec.failedJobsHistoryLimit, value: 3}
      - equal: {path: spec.jobTemplate.spec.backoffLimit, value: 2}
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 3600}
      - notExists: {path: spec.timeZone}
      - equal: {path: spec.jobTemplate.spec.template.spec.restartPolicy, value: Never}

  - it: applies complete pod and container hardening as uid 10001
    set:
      mariadb.backup.enabled: true
    asserts:
      - equal: {path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken, value: false}
      - equal: {path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot, value: true}
      - equal: {path: spec.jobTemplate.spec.template.spec.securityContext.runAsUser, value: 10001}
      - equal: {path: spec.jobTemplate.spec.template.spec.securityContext.runAsGroup, value: 10001}
      - equal: {path: spec.jobTemplate.spec.template.spec.securityContext.fsGroup, value: 10001}
      - equal: {path: spec.jobTemplate.spec.template.spec.securityContext.fsGroupChangePolicy, value: OnRootMismatch}
      - equal: {path: spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsNonRoot", value: true}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsUser", value: 10001}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsGroup", value: 10001}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop[0]", value: ALL}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.seccompProfile.type", value: RuntimeDefault}

  - it: uses explicit database inputs and only the application password Secret
    set:
      mariadb.backup.enabled: true
    asserts:
      - lengthEqual: {path: "spec.jobTemplate.spec.template.spec.containers[0].env", count: 8}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: INDIALLSKY_MARIADB_HOST, value: test-release-indi-allsky-mariadb}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: INDIALLSKY_MARIADB_PORT, value: "3306"}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: INDIALLSKY_MARIADB_SSL, value: "false"}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: MARIADB_USER, value: indi_allsky}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: MARIADB_DATABASE, value: indi_allsky}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MARIADB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-release-indi-allsky-env
                key: MARIADB_PASSWORD
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: INDIALLSKY_BACKUP_DIR, value: /var/www/html/.state/backups}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: INDIALLSKY_BACKUP_RETENTION_DAYS, value: "14"}
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: MARIADB_ROOT_PASSWORD}
          any: true
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: MARIADB_ROOT_PASSWORD_FILE}
          any: true
      # No blanket envFrom anywhere: an opaque Secret must not be able to
      # override the chart-owned endpoint this Job locks and dumps.
      - notExists: {path: "spec.jobTemplate.spec.template.spec.containers[0].envFrom"}
      - lengthEqual: {path: spec.jobTemplate.spec.template.spec.volumes, count: 1}
      - equal: {path: "spec.jobTemplate.spec.template.spec.volumes[0].persistentVolumeClaim.claimName", value: test-release-indi-allsky-data}

  # The dump runs through the shipped, linted, behaviour-tested scripts rather
  # than an inline copy of them, and inside the shared advisory lock.
  - it: runs the shipped backup script under the shared advisory lock
    set:
      mariadb.backup.enabled: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/jaxzin/indi-allsky-web:indi_v2026.08.01
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [/home/allsky/db-maintenance-lock.sh]
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: ["--", /home/allsky/scheduled-backup.sh]
      - lengthEqual: {path: "spec.jobTemplate.spec.template.spec.containers[0].args", count: 2}

  # Minimum visibility: the Job publishes dumps into the .state sibling and has
  # no reason to see the image tree or the web docroot.
  - it: mounts only the state sibling of the shared claim
    set:
      mariadb.backup.enabled: true
    asserts:
      - lengthEqual: {path: "spec.jobTemplate.spec.template.spec.containers[0].volumeMounts", count: 1}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[0].mountPath", value: /var/www/html/.state}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[0].subPath", value: .state}

  - it: keeps a leading-hyphen database name out of the client option list
    set:
      mariadb.backup.enabled: true
      mariadb.database: --all-databases
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: MARIADB_DATABASE, value: --all-databases}

  - it: resolves an existing application Secret and never references the root Secret
    set:
      mariadb.backup.enabled: true
      credentials.existingSecret: existing-app-secret
      credentials.flaskSecretKey: ""
      credentials.flaskPasswordKey: ""
      credentials.mariadbPassword: ""
      mariadb.rootCredentials.existingSecret: existing-root-secret
      mariadb.rootCredentials.password: ""
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MARIADB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: existing-app-secret
                key: MARIADB_PASSWORD
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: MARIADB_ROOT_PASSWORD}
          any: true

  - it: renders chart-wide image pull secrets in parity with MariaDB
    set:
      mariadb.backup.enabled: true
      image.pullSecrets:
        - name: registry-auth
    asserts:
      - equal: {path: "spec.jobTemplate.spec.template.spec.imagePullSecrets[0].name", value: registry-auth}

  - it: mounts the exact existing shared data claim
    set:
      mariadb.backup.enabled: true
      storage.data.existingClaim: data.example
    asserts:
      - equal: {path: "spec.jobTemplate.spec.template.spec.volumes[0].persistentVolumeClaim.claimName", value: data.example}

  - it: omits image pull secrets when none are configured
    set:
      mariadb.backup.enabled: true
    asserts:
      - notExists: {path: spec.jobTemplate.spec.template.spec.imagePullSecrets}

  - it: is omitted in external database mode
    set:
      mariadb.enabled: false
      mariadb.rootCredentials.password: ""
      mariadb.backup.enabled: false
      externalDatabase.host: db.example.com
    asserts:
      - hasDocuments: {count: 0}
