suite: MariaDB root Secret isolation
values:
  - a5-values.yaml
templates:
  - secret-mariadb-root.yaml
release:
  name: test-release
tests:
  - it: renders only the fixed recoverable root credential key
    asserts:
      - equal:
          path: metadata.name
          value: test-release-indi-allsky-mariadb-root
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData
          value:
            MARIADB_ROOT_PASSWORD: test-root-password
      - notExists:
          path: stringData.MARIADB_PASSWORD

  - it: omits the generated root Secret when an existing Secret is selected
    set:
      mariadb.rootCredentials.existingSecret: existing-root-secret
      mariadb.rootCredentials.password: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: omits the root Secret with every internal resource in external mode
    set:
      mariadb.enabled: false
      mariadb.rootCredentials.password: ""
      externalDatabase.host: db.example.com
    asserts:
      - hasDocuments:
          count: 0
