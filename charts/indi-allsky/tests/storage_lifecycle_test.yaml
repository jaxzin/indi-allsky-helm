suite: symmetric generated-storage lifecycle
values:
  - a5-values.yaml
templates:
  - pvc-data.yaml
  - pvc-mariadb.yaml
tests:
  - it: retains the generated shared PVC by default
    template: pvc-data.yaml
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/resource-policy"]'
          value: keep

  - it: retains the generated MariaDB PVC by default
    template: pvc-mariadb.yaml
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/resource-policy"]'
          value: keep

  - it: permits deletion of the generated shared PVC only in Delete mode
    template: pvc-data.yaml
    set:
      storage.retentionPolicy: Delete
    asserts:
      - notExists: {path: 'metadata.annotations["helm.sh/resource-policy"]'}

  - it: permits deletion of the generated MariaDB PVC only in Delete mode
    template: pvc-mariadb.yaml
    set:
      storage.retentionPolicy: Delete
    asserts:
      - notExists: {path: 'metadata.annotations["helm.sh/resource-policy"]'}

  - it: never creates or annotates an existing shared PVC
    template: pvc-data.yaml
    set:
      storage.data.existingClaim: retained-data.example
    asserts:
      - hasDocuments: {count: 0}

  - it: still creates the internal MariaDB PVC when the shared claim is external
    template: pvc-mariadb.yaml
    release:
      name: test-release
    set:
      storage.data.existingClaim: retained-data.example
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: metadata.name, value: test-release-indi-allsky-mariadb-data}

  - it: rejects an invalid policy even when an existing shared claim suppresses the resource
    template: pvc-mariadb.yaml
    set:
      storage.retentionPolicy: Archive
      storage.data.existingClaim: retained-data.example
    asserts:
      - failedTemplate: {errorMessage: "storage.retentionPolicy must be one of: Retain, Delete"}

  - it: renders no MariaDB PVC in external database mode
    template: pvc-mariadb.yaml
    set:
      mariadb.enabled: false
      mariadb.rootCredentials.password: ""
      externalDatabase.host: db.example.com
    asserts:
      - hasDocuments: {count: 0}
