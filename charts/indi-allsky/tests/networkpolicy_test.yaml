suite: portable ingress-only NetworkPolicies
values:
  - a5-values.yaml
templates:
  - networkpolicy-web.yaml
  - networkpolicy-edge.yaml
  - networkpolicy-mariadb.yaml
release:
  name: test-release
tests:
  - it: is on by default
    template: networkpolicy-web.yaml
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: kind, value: NetworkPolicy}
      - equal: {path: metadata.name, value: test-release-indi-allsky-web}

  - it: can be turned off entirely
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments: {count: 0}

  # The whole gunicorn boundary is its loopback bind. What the policy adds is
  # that the sidecar's port is the only one reachable from outside the pod.
  - it: admits nginx 8080 on the web pod and never gunicorn 8000
    template: networkpolicy-web.yaml
    asserts:
      - equal:
          path: 'spec.podSelector.matchLabels["app.kubernetes.io/component"]'
          value: web
      - equal: {path: "spec.policyTypes[0]", value: Ingress}
      - lengthEqual: {path: spec.policyTypes, count: 1}
      - equal: {path: "spec.ingress[0].ports[0].port", value: 8080}
      - lengthEqual: {path: "spec.ingress[0].ports", count: 1}
      - notMatchRegexRaw: {pattern: '8000'}
      # There is no `from`: NetworkPolicy selects pods, not containers, so a
      # same-pod sidecar selector cannot exist. Whatever fronts the Service —
      # an Ingress controller in another namespace, a LoadBalancer — reaches
      # 8080 and only 8080.
      - notExists: {path: "spec.ingress[0].from"}

  # A generic egress rule would break the external database, OIDC provider,
  # MQTT broker, upload targets and DNS, none of which standard NetworkPolicy
  # can express portably.
  - it: renders no egress policy anywhere
    asserts:
      - notMatchRegexRaw: {pattern: 'policyTypes:(?s).*Egress'}
      - notMatchRegexRaw: {pattern: '\negress:'}

  - it: admits no ingress at all to the edge pod
    template: networkpolicy-edge.yaml
    asserts:
      - equal:
          path: 'spec.podSelector.matchLabels["app.kubernetes.io/component"]'
          value: edge
      - equal: {path: "spec.policyTypes[0]", value: Ingress}
      - equal: {path: spec.ingress, value: []}

  - it: admits 3306 only from this release's database clients
    template: networkpolicy-mariadb.yaml
    asserts:
      - hasDocuments: {count: 1}
      - equal:
          path: 'spec.podSelector.matchLabels["app.kubernetes.io/component"]'
          value: mariadb
      - equal: {path: "spec.ingress[0].ports[0].port", value: 3306}
      - equal:
          path: 'spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/instance"]'
          value: test-release
      - equal:
          path: 'spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]'
          value: indi-allsky
      - equal:
          path: "spec.ingress[0].from[0].podSelector.matchExpressions[0].key"
          value: app.kubernetes.io/component
      - equal:
          path: "spec.ingress[0].from[0].podSelector.matchExpressions[0].operator"
          value: In
      - contains:
          path: "spec.ingress[0].from[0].podSelector.matchExpressions[0].values"
          content: web
      - contains:
          path: "spec.ingress[0].from[0].podSelector.matchExpressions[0].values"
          content: edge
      - contains:
          path: "spec.ingress[0].from[0].podSelector.matchExpressions[0].values"
          content: mariadb-backup
      - lengthEqual:
          path: "spec.ingress[0].from[0].podSelector.matchExpressions[0].values"
          count: 3
      # Never a namespace-wide allow: everything else sharing the namespace
      # stays out, which is the difference between a policy and a formality.
      - notExists: {path: "spec.ingress[0].from[0].namespaceSelector"}
      - lengthEqual: {path: "spec.ingress[0].from", count: 1}

  # With an external database there is no pod here to select, and rendering a
  # policy for one would be misleading rather than protective.
  - it: renders no database policy in external database mode
    template: networkpolicy-mariadb.yaml
    set:
      mariadb.enabled: false
      mariadb.rootCredentials.password: ""
      externalDatabase.host: db.example.com
    asserts:
      - hasDocuments: {count: 0}

  - it: still isolates the workloads in external database mode
    template: networkpolicy-web.yaml
    set:
      mariadb.enabled: false
      mariadb.rootCredentials.password: ""
      externalDatabase.host: db.example.com
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: "spec.ingress[0].ports[0].port", value: 8080}
