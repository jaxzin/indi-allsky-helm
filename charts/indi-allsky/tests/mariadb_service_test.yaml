suite: headless MariaDB Service
values:
  - a5-values.yaml
templates:
  - mariadb-service.yaml
release:
  name: test-release
tests:
  - it: renders a headless 3306 Service with MariaDB selectors
    asserts:
      - equal:
          path: metadata.name
          value: test-release-indi-allsky-mariadb
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].name
          value: mysql
      - equal:
          path: spec.ports[0].port
          value: 3306
      - equal:
          path: spec.ports[0].targetPort
          value: mysql
      - equal:
          path: spec.ports[0].protocol
          value: TCP
      - equal:
          path: 'spec.selector["app.kubernetes.io/component"]'
          value: mariadb

  - it: is omitted in external database mode
    set:
      mariadb.enabled: false
      mariadb.rootCredentials.password: ""
      externalDatabase.host: db.example.com
    asserts:
      - hasDocuments:
          count: 0
