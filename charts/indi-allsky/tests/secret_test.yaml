suite: application Secret contract
values:
  - a5-values.yaml
templates:
  - secret-env.yaml
release:
  name: test-release
tests:
  - it: renders exactly the three required inline keys by default
    asserts:
      - equal:
          path: metadata.name
          value: test-release-indi-allsky-env
      - equal:
          path: stringData
          value:
            INDIALLSKY_FLASK_SECRET_KEY: test-flask-secret
            INDIALLSKY_FLASK_PASSWORD_KEY: test-password-key
            MARIADB_PASSWORD: test-database-password
      - notExists:
          path: stringData.INDIALLSKY_OIDC_CLIENT_SECRET
      - notExists:
          path: stringData.INDIALLSKY_WEB_PASS

  - it: adds optional OIDC and local admin secrets only when configured
    set:
      oidc.enabled: true
      oidc.clientId: test-client
      oidc.clientSecret: test-client-secret
      oidc.discoveryEndpoint: https://idp.example.com/.well-known/openid-configuration
      adminUser.username: admin
      credentials.adminPassword: test-admin-password
    asserts:
      - equal:
          path: stringData
          value:
            INDIALLSKY_FLASK_SECRET_KEY: test-flask-secret
            INDIALLSKY_FLASK_PASSWORD_KEY: test-password-key
            MARIADB_PASSWORD: test-database-password
            INDIALLSKY_OIDC_CLIENT_SECRET: test-client-secret
            INDIALLSKY_WEB_PASS: test-admin-password
      - equal:
          path: stringData.INDIALLSKY_OIDC_CLIENT_SECRET
          value: test-client-secret
      - equal:
          path: stringData.INDIALLSKY_WEB_PASS
          value: test-admin-password

  - it: renders no application Secret in existingSecret mode
    set:
      credentials.existingSecret: existing-app-secret
      credentials.flaskSecretKey: ""
      credentials.flaskPasswordKey: ""
      credentials.mariadbPassword: ""
    asserts:
      - hasDocuments:
          count: 0
