image:
  registry: ghcr.io/jaxzin
  tag: ""          # defaults to .Chart.AppVersion
  # Optional per-image digest pins (architect review 2026-08-20): when set, the
  # reference becomes repo@sha256:… and `tag` is ignored for that image. Tags are
  # mutable; digests are the supply-chain control for the privileged edge pod.
  # Each chart release publishes its image digests in the release notes.
  digests:
    indiserver: ""
    daemon: ""
    web: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nodeContract:
  cameraLabel: indi-allsky.io/camera
  sensorsLabel: indi-allsky.io/sensors

# Default-on, portable, ingress-only isolation. Only the nginx sidecar's :8080
# is admitted on the web pod; the edge pod accepts no ingress; the internal
# database admits 3306 from this release's web, edge and backup components
# only. No egress policy is rendered — standard NetworkPolicy cannot portably
# express the external database, OIDC, MQTT, upload or external-indiserver
# destinations this chart supports, and a partial egress policy would break
# them. See docs/configuration.md.
networkPolicy:
  enabled: true

edge:
  priorityClass:
    # create    — this release owns one cluster-scoped PriorityClass (name must
    #             be empty; the chart generates a namespace/release/spec-safe one)
    # reference — an external owner (IaC/CI, or one designated release) created
    #             the class; set `name` and the chart renders no object
    # disabled  — no PriorityClass object and no priorityClassName on the pod
    mode: create
    name: ""                      # required for reference, forbidden otherwise
    value: 1000000
    # PreemptLowerPriority keeps the existing scheduling intent: capture
    # outranks ordinary workloads on the camera node. Never evicts anything
    # when set to Never.
    preemptionPolicy: PreemptLowerPriority
  # Guaranteed QoS: set requests == limits (documented; not enforced)
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  tolerations: []
  podAnnotations: {}       # e.g. Reloader annotations so credential rotation rolls the pod
  # Optional absolute path for capture scratch files. Empty keeps the image
  # default. "/tmp" reuses the daemon container's existing emptyDir; any other
  # absolute path gets a dedicated emptyDir mounted at exactly that path, and
  # is rejected if it would overlap the rendered-config or data mounts.
  captureTmpDir: ""
  # gids granted in hostpath devices mode for /dev access (dialout, gpio, i2c on
  # Raspberry Pi OS/Debian defaults) — adjust to your node OS's group ids.
  # Empty by default and rejected outside hostpath mode: group ids are node
  # state, so a default here would be a guess about someone else's machine.
  supplementalGroups: []
  # Optional capture-freshness liveness: restarts the pod when latest.jpg goes
  # stale (missing file counts as stale — deliberately fail-closed, so do NOT
  # enable before the first frame exists). OFF by default — long exposures,
  # disabled daytime capture, or darks mode make a static threshold false-positive;
  # enable with a maxAgeSeconds comfortably above your longest capture cadence.
  freshnessProbe:
    enabled: false
    maxAgeSeconds: 900
  sensors:
    # Off by default: enabling it requires a sensor access mechanism, and in
    # hostpath mode also pins the pod to a node carrying nodeContract.sensorsLabel.
    enabled: false
  devices:
    # none          — simulator/no local hardware. Schedulable anywhere, no
    #                 host devices, no privileged container. The default.
    # device-plugin — preferred hardware path: a device plugin advertises an
    #                 extended resource and the scheduler places the pod.
    # hostpath      — explicit opt-in. Mounts host device paths and makes the
    #                 indiserver sidecar privileged for a local camera.
    mode: none
    camera:
      # Structured entries only, never bare strings — the chart renders the
      # readOnly you set and never infers access from a path:
      #   - path: /dev/bus/usb
      #     type: Directory        # Directory | CharDevice
      #     readOnly: false
      hostPaths: []
      resources: {}        # device-plugin mode, e.g. {squat.ai/asi-camera: 1}
    sensors:
      # Same structured shape. A one-wire sysfs tree is read-only:
      #   - path: /dev/i2c-1
      #     type: CharDevice
      #     readOnly: false
      #   - path: /sys/bus/w1
      #     type: Directory
      #     readOnly: true
      hostPaths: []
      resources: {}
  darks:
    enabled: false         # runs darks.py instead of capture (maintenance mode)
    daytime: true          # true passes --daytime; false passes --no-daytime
    bitmax: 16
    mode: average          # flush | average | tempaverage | sigmaclip | tempsigmaclip

indiserver:
  mode: sidecar            # sidecar | external
  ccdDriver: indi_simulator_ccd
  gpsDriver: ""
  external:
    host: ""
    port: 7624
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi

web:
  # replicas is intentionally not exposed: migrations + config seeding assume 1
  nodeSelector: {}
  podAnnotations: {}       # e.g. Reloader annotations for credential rotation
  nginx:
    # The static/proxy sidecar image — a values key so it can be digest-pinned,
    # mirrored, or CVE-patched without forking the chart (security review
    # 2026-08-20: this container terminates ingress traffic and mounts the data PVC).
    image: nginx:1.29-alpine
  resources: {}
  authAllViews: false
  # Keep both session and remember-me cookies HTTPS-only. Set false only for a
  # deliberately plain-HTTP deployment, where secure cookies cannot be returned.
  sessionCookieSecure: true
  # JSON-serialized into INDIALLSKY_ADMIN_NETWORKS. Empty deliberately removes
  # upstream's blanket RFC1918 trust; see docs/configuration.md.
  adminNetworks: []
  service:
    port: 8080
  ingress:
    enabled: false
    className: ""
    host: allsky.example.com
    annotations: {}
    tls: []                # optional; omit when the cluster has a default cert

# Deep-merged over the app's DB config by the migrate initContainer on each
# deploy. Keys here are GitOps-owned; everything else stays UI-owned.
# INDI_SERVER / INDI_PORT / IMAGE_FOLDER are chart-managed — do not set here.
appConfig: {}

migrations:
  # Take a mariadb-dump before any schema-mutating migration (guarded parity,
  # 2026-08-20). Disable ONLY for external databases with least-privilege users
  # and DBA-managed backups — you are then accepting unguarded autogenerate DDL.
  preMigrateDump: true
  # Number of verified pre-migration dumps retained by migrate.sh. Must remain
  # at least 1; zero would delete the safety dump immediately before mutation.
  preMigrateDumpKeep: 8

oidc:
  enabled: false
  providerName: ""
  clientId: ""
  clientSecret: ""         # dev only — prefer credentials.existingSecret
  discoveryEndpoint: ""
  usernameClaim: preferred_username
  allowedGroups: []
  adminGroups: []
  autoLogin: false
  # Renders/hides the local username+password login form. Upstream keeps the POST
  # handler active regardless — but when this is false the chart seeds no local
  # admin (see adminUser), so no local credential exists to use against it.
  localAuth: true

# Local admin seeded only when oidc.localAuth is true AND adminUser.username set
adminUser:
  username: ""
  name: "Admin"
  email: "admin@example.com"

credentials:
  # Either provide an existingSecret with the keys below, or set inline values (dev only).
  # Required keys: INDIALLSKY_FLASK_SECRET_KEY, INDIALLSKY_FLASK_PASSWORD_KEY, MARIADB_PASSWORD.
  # Optional keys: INDIALLSKY_OIDC_CLIENT_ID, INDIALLSKY_OIDC_CLIENT_SECRET,
  #   INDIALLSKY_OIDC_DISCOVERY_ENDPOINT, INDIALLSKY_WEB_PASS.
  # Mechanism: chart-owned non-secret settings arrive through the env ConfigMap's
  # envFrom; the application Secret is NEVER consumed through a blanket envFrom.
  # Each container declares an explicit secretKeyRef allowlist of exactly the
  # keys it uses, so an opaque Secret cannot override chart-owned configuration
  # and no container sees a credential it has no use for (the gunicorn container
  # never receives INDIALLSKY_WEB_PASS; nginx and static-copy receive nothing).
  # The optional keys are projected with optional: true, so OIDC client id and
  # discovery endpoint may still live in either the ConfigMap or the Secret.
  existingSecret: ""
  flaskSecretKey: ""
  flaskPasswordKey: ""     # Fernet key — losing it makes stored app passwords unrecoverable
  mariadbPassword: ""
  adminPassword: ""

storage:
  # Retain protects the shared application recovery set and internal database
  # PVCs across uninstall. Switch to Delete in a deliberate upgrade before an
  # automated uninstall when those PVCs should be removed.
  retentionPolicy: Retain
  data:
    # RWX required whenever edge and web can land on different nodes
    existingClaim: ""
    # Empty selects the cluster default; a non-empty value must be a DNS subdomain.
    storageClassName: ""
    accessModes: [ReadWriteMany]
    # Kubernetes quantity, kept as a non-empty string and quoted in the manifest.
    size: 100Gi

mariadb:
  enabled: true
  image: mariadb:11.8
  database: indi_allsky
  username: indi_allsky
  nodeSelector: {}
  resources: {}
  # Separate recoverable root credential. This Secret is mounted only into the
  # MariaDB container and never reaches application or backup workloads.
  rootCredentials:
    existingSecret: ""
    password: ""            # development only; prefer existingSecret
  persistence:
    # Empty selects the cluster default; a non-empty value must be a DNS subdomain.
    storageClassName: ""
    # Kubernetes quantity, kept as a non-empty string and quoted in the manifest.
    size: 8Gi
  backup:
    enabled: false
    schedule: "20 4 * * *"
    retentionDays: 14

externalDatabase:
  host: ""
  port: 3306
  database: indi_allsky
  username: indi_allsky
  ssl: false
  charset: utf8mb4
  collation: utf8mb4_unicode_ci

# Optional in-cluster MQTT broker for upstream's MQTTPUBLISH and its
# remote-sensor helpers. Deliberately unauthenticated in v1 (the image's own
# /mosquitto-no-auth.conf): the chart's NetworkPolicy is its access control, and
# an operator who needs credentials or TLS brings their own broker. See
# docs/topologies.md.
mosquitto:
  enabled: false
  image: eclipse-mosquitto:2.0
  nodeSelector: {}
  resources: {}

timezone: UTC

discovery:
  nfd:
    # Requires Node Feature Discovery installed in the cluster — the chart
    # renders the NodeFeatureRule, not NFD itself. No NFD worker configuration
    # is needed: the rule matches the raw usb.device feature set, which
    # deviceClassWhitelist does not filter. See docs/topologies.md.
    enabled: false
    # Lowercase 4-hex-digit sysfs idVendor values. Quote them: 1618 unquoted is
    # a YAML integer, and the CRD requires strings.
    usbVendorIds: ["03c3", "1618"]   # ZWO, QHY — extend via values
