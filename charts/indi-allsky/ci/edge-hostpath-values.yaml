# CI-only fixture for the explicit hostPath opt-in, which the default secure
# values deliberately do not exercise: host device volumes, the privileged
# indiserver sidecar, supplemental groups, camera/sensor node selectors, an
# externally owned PriorityClass, and an enabled Ingress with TLS. All
# credentials are throwaway render fixtures; this directory is excluded from
# packaged charts by .helmignore.
#
# It also carries both optional extras, because this is the fixture with real
# local hardware: NFD camera autodiscovery only makes sense on a node with a
# camera physically attached, and the broker is the natural companion to a
# capture pipeline publishing MQTT. This is therefore the render that exercises
# the NodeFeatureRule against kubeconform's kind-scoped skip.
credentials:
  flaskSecretKey: ci-dummy
  flaskPasswordKey: ci-dummy
  mariadbPassword: ci-dummy
mariadb:
  rootCredentials:
    password: ci-root-dummy
edge:
  priorityClass:
    mode: reference
    name: ci-platform-owned-capture
  supplementalGroups: [20, 997, 998]
  captureTmpDir: /var/tmp/indi-allsky-capture
  freshnessProbe:
    enabled: true
    maxAgeSeconds: 900
  tolerations:
    - key: indi-allsky.io/camera
      operator: Exists
      effect: NoSchedule
  sensors:
    enabled: true
  devices:
    mode: hostpath
    camera:
      hostPaths:
        - path: /dev/bus/usb
          type: Directory
          readOnly: false
    sensors:
      hostPaths:
        - path: /dev/i2c-1
          type: CharDevice
          readOnly: false
        - path: /dev/gpiochip0
          type: CharDevice
          readOnly: false
        # The one-wire sysfs tree only needs to be read.
        - path: /sys/bus/w1
          type: Directory
          readOnly: true
web:
  ingress:
    enabled: true
    className: nginx
    host: allsky.ci.example.com
    annotations:
      cert-manager.io/cluster-issuer: ci-issuer
    tls:
      - hosts: [allsky.ci.example.com]
        secretName: ci-allsky-tls
mosquitto:
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}
discovery:
  nfd:
    enabled: true
    # ZWO, QHY and a third id, so the render covers a list an operator extended
    # rather than only the shipped default.
    usbVendorIds: ["03c3", "1618", "0547"]
