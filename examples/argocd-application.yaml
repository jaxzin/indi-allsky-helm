# Argo CD Application installing the published OCI chart.
#
# Two sources: the chart comes from GHCR, and the values file comes from this
# git repo through a `$values` reference. Swap the second source for YOUR OWN
# repo once you have copied examples/values-zwo-pi.yaml and edited the values
# it marks CHANGE ME — the copy here is a worked example, not a config for
# your site.
#
# Needs Argo CD 2.6 or newer for multi-source Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: indi-allsky
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jaxzin/charts
      chart: indi-allsky
      # A chart version, not the git tag: release `chart-v<version>` publishes
      # chart version `<version>` (same string, without the `chart-v`
      # prefix). Pin it exactly — a range like `0.1.x` would let a patch
      # release land without a reviewed diff. Current version:
      # https://github.com/jaxzin/indi-allsky-helm/releases
      targetRevision: 0.1.0-rc.1
      helm:
        valueFiles:
          - $values/examples/values-zwo-pi.yaml
        # Left commented out on purpose: the published OCI chart already
        # defaults to the exact digests it was released with, baked into the
        # package itself. Uncomment and fill in ONLY to override those with
        # different digests — setting this to the same values is redundant,
        # and setting any to an empty string overrides the safe default with
        # a mutable-tag fallback instead.
        values: |
          # image:
          #   digests:
          #     indiserver: sha256:...
          #     daemon: sha256:...
          #     web: sha256:...
    - repoURL: https://github.com/jaxzin/indi-allsky-helm
      targetRevision: chart-v0.1.0-rc.1
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: indi-allsky
  syncPolicy:
    automated:
      # Both PVCs carry helm.sh/resource-policy: keep while
      # storage.retentionPolicy is Retain (the default), so prune does not
      # take your images and database with it.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
# Single-source alternative: consume the chart straight from git at the release
# commit, rather than from GHCR. This is the shape for anyone who wants the
# chart source pinned to an exact revision they can read.
