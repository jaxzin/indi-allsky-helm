name: lint

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Wrapper pins the rhysd/actionlint container by digest in its
      # settings.json (1.7.12 at this release).
      - uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find shell scripts
        id: files
        run: |
          # Print the matches: the guard below is silent about what it found,
          # so without this a linter that scanned nothing looks the same in the
          # log as one that scanned everything.
          find images -name '*.sh' -type f -print
          if find images -name '*.sh' -type f 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No shell scripts found under images/; skipping."
          fi
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        if: steps.files.outputs.found == 'true'
        with:
          scandir: ./images
      - name: Find chart test shell scripts
        run: |
          find charts/indi-allsky/tests -name '*.sh' -type f -print
          test -n "$(find charts/indi-allsky/tests -name '*.sh' -type f -print -quit)"
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./charts/indi-allsky/tests
      - name: Find e2e shell scripts
        run: |
          find e2e -name '*.sh' -type f -print
          test -n "$(find e2e -name '*.sh' -type f -print -quit)"
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./e2e
      - name: Find repo-maintenance shell scripts
        run: |
          find scripts -name '*.sh' -type f -print
          test -n "$(find scripts -name '*.sh' -type f -print -quit)"
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find Dockerfiles
        id: files
        run: |
          # Print the matches: see the shellcheck job's note above.
          find images -name 'Dockerfile*' -type f -print
          if find images -name 'Dockerfile*' -type f 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfiles found under images/; skipping."
          fi
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        if: steps.files.outputs.found == 'true'
        with:
          dockerfile: images/**/Dockerfile*
          recursive: true

  # Secret-free PR-side validation of the upstream pin gate and the bake
  # graph: no registry login, no push, nothing built.
  bake-print:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the pin gate and validate the bake graph
        run: make bake-print

      # Same job because it needs the same pinned checkout and the same
      # nothing-is-built guarantee.
      - name: Static image contract
        run: images/tests/image-contract.sh --static-contract
