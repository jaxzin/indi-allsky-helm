name: chart-ci

on:
  pull_request:
    paths:
      - "charts/**"
      # db-maintenance-behavior.sh runs the shipped image scripts, so a change
      # to those alone still has to reach this workflow.
      - "images/**"
      - "e2e/**"
      # The shipped examples are rendered by the strict matrix below.
      - "examples/**"
      - "ct.yaml"
      - ".github/workflows/chart-ci.yml"
      - "UPSTREAM_VERSION"
      # README.md and scripts/** carry the tracked chart-version references
      # scripts/sync-chart-version.sh checks below.
      - "README.md"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "charts/**"
      # db-maintenance-behavior.sh runs the shipped image scripts, so a change
      # to those alone still has to reach this workflow.
      - "images/**"
      - "e2e/**"
      # The shipped examples are rendered by the strict matrix below.
      - "examples/**"
      - "ct.yaml"
      - ".github/workflows/chart-ci.yml"
      - "UPSTREAM_VERSION"
      - "README.md"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: chart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # UPSTREAM_VERSION is the single source of truth for the upstream build
      # pin; Chart.yaml appVersion is the deliberately-synced chart-facing copy
      # of it. Fail fast on drift. Guarded on existence because UPSTREAM_VERSION
      # lands with the image-build scaffolding — the guard tightens into a real
      # check automatically once that file is on the branch.
      - name: Chart appVersion matches UPSTREAM_VERSION
        run: |
          if [ ! -f UPSTREAM_VERSION ]; then
            echo "UPSTREAM_VERSION not present yet; skipping drift check (becomes enforcing once the file lands)."
            exit 0
          fi
          upstream="$(cat UPSTREAM_VERSION)"
          appver="$(yq -r .appVersion charts/indi-allsky/Chart.yaml)"
          if [ "$upstream" != "$appver" ]; then
            echo "::error::UPSTREAM_VERSION ($upstream) and Chart.yaml appVersion ($appver) have drifted — update charts/indi-allsky/Chart.yaml appVersion to match the upstream build pin."
            exit 1
          fi
          echo "appVersion $appver matches UPSTREAM_VERSION"

      # Chart.yaml's version is the single source of truth for every other
      # place a concrete chart version has to appear (README's install
      # command, the GitOps examples' pinned fields) — scripts/sync-
      # chart-version.sh is the one command that writes it everywhere at
      # once. This is what enforces that nobody hand-edited one of those
      # fields, or bumped Chart.yaml, without running it.
      - name: Chart version is in sync across README and examples
        run: scripts/sync-chart-version.sh --check

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The SHA above pins the action, not helm — pin helm explicitly too.
          version: v3.21.4

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2

      - name: Validate chart test YAML and validation wiring
        run: |
          for test_yaml in charts/indi-allsky/tests/*.yaml; do
            yq eval '.' "$test_yaml" >/dev/null
          done
          charts/indi-allsky/tests/check-validation-wiring.sh

      - name: Direct invalid-render matrix
        run: charts/indi-allsky/tests/render-validation-matrix.sh

      - name: helm unittest
        run: helm unittest charts/indi-allsky

      # Negative control: proves the suites above would notice if the chart
      # stopped honouring a contract, rather than only that they pass today.
      - name: Unit-test mutation controls
        run: charts/indi-allsky/tests/mutation-controls.sh

      - name: Disposable MariaDB and backup behavior
        run: charts/indi-allsky/tests/mariadb-behavior.sh

      # The advisory lock and the atomic dump publication are behaviour, not
      # manifest content: this exercises the shipped scripts against a real
      # MariaDB, in both overlap orders.
      - name: Database maintenance serialization and dump safety
        run: charts/indi-allsky/tests/db-maintenance-behavior.sh

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: ct lint
        run: ct lint --config ct.yaml

      # ci/ci-values.yaml carries throwaway dev credentials so this render keeps
      # passing once required-credential guards land (Task A5, #4) — CI never
      # holds real secrets. kubeconform is digest-pinned (tags are mutable) and
      # reads the manifests on stdin.
      #
      # `-skip NodeFeatureRule` is the one concession, and it is deliberately a
      # kind-scoped skip rather than `-ignore-missing-schemas` (#7). NFD's
      # NodeFeatureRule is a CRD kind kubeconform ships no builtin schema for,
      # and this is the only such kind the chart renders. Scoped this way,
      # `-strict` stays fully enforcing for everything else: any OTHER unknown
      # kind — a second CRD, a typo'd `kind:` — still fails the job, which a
      # blanket ignore would have silently accepted.
      #
      # The rejected alternative was vendoring a JSON Schema converted from
      # NFD's published CRD and pointing `-schema-location` at it. It validates
      # (proven during development against NFD v0.19.0's CRD), but it pins the
      # repo to one NFD version's schema for a v1alpha1 API while the chart
      # deliberately pins no NFD version — a vendored artifact that rots without
      # anything noticing. The rule's structure is instead asserted field by
      # field in charts/indi-allsky/tests/extras_test.yaml, with a mutation
      # control proving those assertions bite.
      #
      # examples/ is in this matrix too. A shipped example that stops rendering
      # is worse than no example — it is copy-pasted before it is tested — and
      # nothing else in CI would notice a values key it still names after a
      # rename.
      - name: Strict render matrix and kubeconform
        run: |
          for values_file in \
            charts/indi-allsky/ci/ci-values.yaml \
            charts/indi-allsky/ci/backup-values.yaml \
            charts/indi-allsky/ci/external-values.yaml \
            charts/indi-allsky/ci/edge-hostpath-values.yaml \
            charts/indi-allsky/ci/edge-device-plugin-values.yaml \
            examples/values-zwo-pi.yaml; do
            # ci/ fixtures are <mode>-values.yaml; examples/ are values-<mode>.yaml.
            mode="$(basename "$values_file" .yaml)"
            mode="${mode%-values}"
            mode="${mode#values-}"
            echo "Rendering ${mode} mode"
            helm template "ci-${mode}" charts/indi-allsky \
              --values "$values_file" | \
              docker run -i ghcr.io/yannh/kubeconform@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f \
              -strict -summary -exit-on-error -kubernetes-version 1.26.0 \
              -skip NodeFeatureRule
          done

      # examples/flux-helmrelease.yaml is a Flux manifest rather than a values
      # file, so the loop above cannot reach it — but it carries a real embedded
      # values block, which gets copy-pasted exactly like the others and rots
      # exactly like the others. Extract and render it for the same reason.
      # The Argo CD example carries no values of its own: it references
      # examples/values-zwo-pi.yaml, which the loop above already renders.
      - name: Render the Flux example's embedded values
        run: |
          yq -r 'select(.kind == "HelmRelease") | .spec.values' \
            examples/flux-helmrelease.yaml > flux-values.yaml
          test -s flux-values.yaml
          helm template ci-flux charts/indi-allsky --values flux-values.yaml | \
            docker run -i ghcr.io/yannh/kubeconform@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f \
            -strict -summary -exit-on-error -kubernetes-version 1.26.0 \
            -skip NodeFeatureRule

  # --- end-to-end release gate (Task A9, #8) ---------------------------------
  #
  # Two kind clusters rather than one, split by what each set of scenarios
  # needs from the CLUSTER rather than by subject matter:
  #
  #   e2e-pipeline — three nodes and a NetworkPolicy-enforcing CNI. The
  #     secure-default pipeline, runtime policy enforcement, and the
  #     node-contract placement proof all need a multi-node cluster, and the
  #     policy proofs additionally need a CNI that is not kindnet.
  #   e2e-database — two nodes and kind's default CNI. The overlay barrier,
  #     the advisory-lock overlap, the migration paths and the restore
  #     procedure assert nothing about placement or dropped packets, so paying
  #     for a third node and a Calico install would buy them nothing.
  #
  # They run in parallel. One combined job would serialize roughly fifty
  # minutes of scenarios behind a single cluster and would make every failure
  # cost a full re-run of everything before it.
  e2e-pipeline:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The SHA above pins the action, not helm — pin helm explicitly too.
          version: v3.21.4

      # `wait: 0s` is required, not a shortcut: this cluster disables the
      # default CNI, so no node reaches Ready until e2e/install-cni.sh has
      # applied Calico. Any non-zero wait here times out on a cluster that is
      # behaving exactly as intended.
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          node_image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
          cluster_name: e2e-pipeline
          config: e2e/kind-pipeline.yaml
          wait: 0s

      - name: Install and prove a NetworkPolicy-enforcing CNI
        run: e2e/install-cni.sh

      - name: Install the secure-default release
        run: e2e/install-release.sh --wait

      - name: Secure-default capture pipeline
        run: e2e/verify-pipeline.sh

      - name: NetworkPolicy runtime enforcement
        run: e2e/verify-networkpolicy.sh

      # The placement scenario installs a second release with its own database
      # and web pod. Releasing the first one first keeps peak load on a
      # four-core runner well inside what the capture pipeline needs, and keeps
      # a resource-starvation failure from being misread as a scheduling one.
      - name: Release the pipeline cluster for the placement scenario
        run: |
          kubectl --namespace allsky delete pod e2e-workbench --ignore-not-found --timeout=60s
          helm uninstall allsky --namespace allsky --wait --timeout 5m
          kubectl delete namespace allsky --timeout=5m

      - name: Node-contract placement
        run: e2e/verify-placement.sh

      - name: Failure diagnostics
        if: failure()
        run: e2e/collect-diagnostics.sh

  e2e-database:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          node_image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
          cluster_name: e2e-database
          config: e2e/kind-database.yaml
          wait: 120s

      - name: Install the secure-default release
        run: e2e/install-release.sh --wait

      # The same headline proof as the other job, and a precondition rather
      # than duplication: every scenario below needs a populated image
      # catalogue, a seeded account and a released overlay barrier to start
      # from, and needs to know it had them before it started breaking things.
      - name: Baseline capture pipeline
        run: e2e/verify-pipeline.sh

      - name: Overlay barrier state matrix
        run: e2e/verify-overlay-barrier.sh

      - name: Advisory lock, both overlap orders
        run: e2e/verify-db-maintenance.sh

      - name: Migration paths (guarded autogenerate, escape hatch, committed revision)
        run: e2e/verify-migration-paths.sh

      - name: Backup and restore procedure
        run: e2e/verify-restore.sh

      - name: Failure diagnostics
        if: failure()
        run: e2e/collect-diagnostics.sh
