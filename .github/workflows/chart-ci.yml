name: chart-ci

on:
  pull_request:
    paths:
      - "charts/**"
      # db-maintenance-behavior.sh runs the shipped image scripts, so a change
      # to those alone still has to reach this workflow.
      - "images/**"
      - "e2e/**"
      - "ct.yaml"
      - ".github/workflows/chart-ci.yml"
      - "UPSTREAM_VERSION"
  push:
    branches: [main]
    paths:
      - "charts/**"
      # db-maintenance-behavior.sh runs the shipped image scripts, so a change
      # to those alone still has to reach this workflow.
      - "images/**"
      - "e2e/**"
      - "ct.yaml"
      - ".github/workflows/chart-ci.yml"
      - "UPSTREAM_VERSION"

permissions:
  contents: read

concurrency:
  group: chart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # UPSTREAM_VERSION is the single source of truth for the upstream build
      # pin; Chart.yaml appVersion is the deliberately-synced chart-facing copy
      # of it. Fail fast on drift. Guarded on existence because UPSTREAM_VERSION
      # lands with the image-build scaffolding — the guard tightens into a real
      # check automatically once that file is on the branch.
      - name: Chart appVersion matches UPSTREAM_VERSION
        run: |
          if [ ! -f UPSTREAM_VERSION ]; then
            echo "UPSTREAM_VERSION not present yet; skipping drift check (becomes enforcing once the file lands)."
            exit 0
          fi
          upstream="$(cat UPSTREAM_VERSION)"
          appver="$(yq -r .appVersion charts/indi-allsky/Chart.yaml)"
          if [ "$upstream" != "$appver" ]; then
            echo "::error::UPSTREAM_VERSION ($upstream) and Chart.yaml appVersion ($appver) have drifted — update charts/indi-allsky/Chart.yaml appVersion to match the upstream build pin."
            exit 1
          fi
          echo "appVersion $appver matches UPSTREAM_VERSION"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The SHA above pins the action, not helm — pin helm explicitly too.
          version: v3.21.4

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2

      - name: Validate chart test YAML and validation wiring
        run: |
          for test_yaml in charts/indi-allsky/tests/*.yaml; do
            yq eval '.' "$test_yaml" >/dev/null
          done
          charts/indi-allsky/tests/check-validation-wiring.sh

      - name: Direct invalid-render matrix
        run: charts/indi-allsky/tests/render-validation-matrix.sh

      - name: helm unittest
        run: helm unittest charts/indi-allsky

      # Negative control: proves the suites above would notice if the chart
      # stopped honouring a contract, rather than only that they pass today.
      - name: Unit-test mutation controls
        run: charts/indi-allsky/tests/mutation-controls.sh

      - name: Disposable MariaDB and backup behavior
        run: charts/indi-allsky/tests/mariadb-behavior.sh

      # The advisory lock and the atomic dump publication are behaviour, not
      # manifest content: this exercises the shipped scripts against a real
      # MariaDB, in both overlap orders.
      - name: Database maintenance serialization and dump safety
        run: charts/indi-allsky/tests/db-maintenance-behavior.sh

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: ct lint
        run: ct lint --config ct.yaml

      # ci/ci-values.yaml carries throwaway dev credentials so this render keeps
      # passing once required-credential guards land (Task A5, #4) — CI never
      # holds real secrets. kubeconform is digest-pinned (tags are mutable) and
      # reads the manifests on stdin.
      #
      # `-skip NodeFeatureRule` is the one concession, and it is deliberately a
      # kind-scoped skip rather than `-ignore-missing-schemas` (#7). NFD's
      # NodeFeatureRule is a CRD kind kubeconform ships no builtin schema for,
      # and this is the only such kind the chart renders. Scoped this way,
      # `-strict` stays fully enforcing for everything else: any OTHER unknown
      # kind — a second CRD, a typo'd `kind:` — still fails the job, which a
      # blanket ignore would have silently accepted.
      #
      # The rejected alternative was vendoring a JSON Schema converted from
      # NFD's published CRD and pointing `-schema-location` at it. It validates
      # (proven during development against NFD v0.19.0's CRD), but it pins the
      # repo to one NFD version's schema for a v1alpha1 API while the chart
      # deliberately pins no NFD version — a vendored artifact that rots without
      # anything noticing. The rule's structure is instead asserted field by
      # field in charts/indi-allsky/tests/extras_test.yaml, with a mutation
      # control proving those assertions bite.
      - name: Strict render matrix and kubeconform
        run: |
          for values_file in \
            charts/indi-allsky/ci/ci-values.yaml \
            charts/indi-allsky/ci/backup-values.yaml \
            charts/indi-allsky/ci/external-values.yaml \
            charts/indi-allsky/ci/edge-hostpath-values.yaml \
            charts/indi-allsky/ci/edge-device-plugin-values.yaml; do
            mode="$(basename "$values_file" -values.yaml)"
            echo "Rendering ${mode} mode"
            helm template "ci-${mode}" charts/indi-allsky \
              --values "$values_file" | \
              docker run -i ghcr.io/yannh/kubeconform@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f \
              -strict -summary -exit-on-error -kubernetes-version 1.26.0 \
              -skip NodeFeatureRule
          done

  # e2e job (kind + INDI simulator smoke test) is added in Task A9 (#8).
