name: release

# Cut a chart release by pushing an annotated tag `chart-v<semver>` at the
# commit you want published. Everything below is derived from that tag and from
# files already in the tree — nothing about a release is typed into a form.
on:
  push:
    tags: ["chart-v*"]

# Read-only by default; the one job that publishes widens to exactly what it
# needs and nothing else.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in flight: a half-cancelled run can leave a pushed
  # chart with no GitHub Release describing it.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the OCI chart to GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The SHA above pins the action, not helm — pin helm explicitly too.
          version: v3.21.4

      # The tag is the only human input to a release, so it is the one thing
      # that can disagree with the tree. `helm package --version` would happily
      # override Chart.yaml and publish a chart whose in-repo version says
      # something else, so refuse instead: Chart.yaml stays the source of truth
      # and the tag has to agree with it.
      - name: Tag, chart version and upstream pin agree
        id: pin
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#chart-v}"
          chart_version="$(yq -r .version charts/indi-allsky/Chart.yaml)"
          app_version="$(yq -r .appVersion charts/indi-allsky/Chart.yaml)"
          upstream_tag="$(cat UPSTREAM_VERSION)"

          if [ "$version" != "$chart_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies chart version ${version}, but charts/indi-allsky/Chart.yaml says ${chart_version}."
            exit 1
          fi
          if [ "$app_version" != "$upstream_tag" ]; then
            echo "::error::Chart.yaml appVersion (${app_version}) and UPSTREAM_VERSION (${upstream_tag}) have drifted — the release would name an upstream version it was not built against."
            exit 1
          fi

          # SemVer 2.0.0 §9: a hyphen introduces the pre-release identifier
          # (1.0.0-alpha, 0.1.0-rc.1, ...). GitHub's own "pre-release" flag
          # exists for exactly this signal, so derive it from the version
          # already validated above rather than typing it in by hand at tag
          # time, where it could silently disagree with what was tagged.
          case "$version" in
            *-*) is_prerelease=true ;;
            *) is_prerelease=false ;;
          esac

          echo "chart ${version}, upstream ${upstream_tag}, commit ${GITHUB_SHA}, prerelease ${is_prerelease}"
          {
            echo "version=${version}"
            echo "upstream_tag=${upstream_tag}"
            echo "is_prerelease=${is_prerelease}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recording the digests is not paperwork — it is the only way a consumer
      # can pin `image.digests.*` to what this chart version was actually
      # tested against. Resolved here rather than pasted in by hand, and
      # resolved BEFORE anything is published, so a release cannot describe
      # images that do not exist at the pinned upstream tag.
      - name: Resolve published image digests
        id: digests
        env:
          REGISTRY: ghcr.io/jaxzin
          UPSTREAM_TAG: ${{ steps.pin.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          for image in indiserver daemon web; do
            ref="${REGISTRY}/indi-allsky-${image}:${UPSTREAM_TAG}"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            case "$digest" in
              sha256:*) ;;
              *)
                echo "::error::${ref} did not resolve to a manifest digest (got '${digest}')"
                exit 1
                ;;
            esac
            echo "${image}: ${ref} -> ${digest}"
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
          done

      # Supply-chain defense, not a convenience default: `image.digests.*` is
      # documented as "the production pinning path" but was, until now, an
      # opt-in a consumer had to remember to set. Baking the digests just
      # resolved above into the PACKAGED chart's own values.yaml — never the
      # tracked repo copy, which stays digest-free for dev/CI use against
      # `:main` — means every `helm install` of this release defaults to the
      # exact SHA-pinned manifests it was tested against, tag drift and
      # `IfNotPresent` cache divergence included, with no `--set` required.
      # The checkout is a disposable runner workspace, so mutating it in
      # place before packaging is safe: nothing here is ever committed back.
      - name: Bake resolved digests into the packaged chart's defaults
        env:
          INDISERVER_DIGEST: ${{ steps.digests.outputs.indiserver }}
          DAEMON_DIGEST: ${{ steps.digests.outputs.daemon }}
          WEB_DIGEST: ${{ steps.digests.outputs.web }}
        run: |
          set -euo pipefail
          values="charts/indi-allsky/values.yaml"
          yq -i "
            .image.digests.indiserver = strenv(INDISERVER_DIGEST) |
            .image.digests.daemon = strenv(DAEMON_DIGEST) |
            .image.digests.web = strenv(WEB_DIGEST)
          " "$values"
          for image in indiserver daemon web; do
            digest="$(yq -r ".image.digests.${image}" "$values")"
            case "$digest" in
              sha256:*) ;;
              *)
                echo "::error::baked ${values} .image.digests.${image} is not a digest (got '${digest}')"
                exit 1
                ;;
            esac
          done
          echo "Packaged chart will default to digest-pinned images:"
          yq '.image.digests' "$values"

      # `helm registry login` keeps its own credential store, separate from the
      # docker login above, so both are needed. --password-stdin keeps the token
      # out of the process table.
      #
      # The digest check runs on the LOCAL .tgz, before push — deliberately
      # redundant with the baking step's own assertion above, and with the
      # post-push check below. Once `helm push` succeeds, a chart later found
      # to be mis-pinned is already published under that version number with
      # no way to un-publish or re-push it (the pin gate refuses a reused
      # tag). Catching a bad package before that point is a hard requirement,
      # not belt-and-braces; catching it after is what the next step is for,
      # in case the registry round-trip itself corrupted something this
      # cannot see.
      - name: Package, verify locally, then push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pin.outputs.version }}
          INDISERVER_DIGEST: ${{ steps.digests.outputs.indiserver }}
          DAEMON_DIGEST: ${{ steps.digests.outputs.daemon }}
          WEB_DIGEST: ${{ steps.digests.outputs.web }}
        run: |
          set -euo pipefail
          helm package charts/indi-allsky --version "$VERSION"

          packaged_values="$(helm show values "indi-allsky-${VERSION}.tgz")"
          for pair in "indiserver=$INDISERVER_DIGEST" "daemon=$DAEMON_DIGEST" "web=$WEB_DIGEST"; do
            image="${pair%%=*}"
            expected="${pair#*=}"
            actual="$(echo "$packaged_values" | yq -r ".image.digests.${image}")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::local package indi-allsky-${VERSION}.tgz has image.digests.${image}='${actual}', expected '${expected}' — refusing to push a chart that does not pin what it claims to" >&2
              exit 1
            fi
          done
          echo "Local package is digest-pinned; pushing"

          printf '%s' "$GH_TOKEN" |
            helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "indi-allsky-${VERSION}.tgz" oci://ghcr.io/jaxzin/charts

      # Prove the artifact is consumable the way the README tells operators to
      # consume it, rather than trusting that a successful push implies a
      # working pull — and that the registry round-trip did not corrupt what
      # the local check above already proved. This is now a second
      # independent check on an already-verified property, not the only
      # thing standing between a bad bake and a published release.
      - name: Verify the published chart is pullable and digest-pinned
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          INDISERVER_DIGEST: ${{ steps.digests.outputs.indiserver }}
          DAEMON_DIGEST: ${{ steps.digests.outputs.daemon }}
          WEB_DIGEST: ${{ steps.digests.outputs.web }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          helm pull oci://ghcr.io/jaxzin/charts/indi-allsky \
            --version "$VERSION" --destination "$work"
          test -s "${work}/indi-allsky-${VERSION}.tgz"
          helm show chart "${work}/indi-allsky-${VERSION}.tgz"

          pulled_values="$(helm show values "${work}/indi-allsky-${VERSION}.tgz")"
          for pair in "indiserver=$INDISERVER_DIGEST" "daemon=$DAEMON_DIGEST" "web=$WEB_DIGEST"; do
            image="${pair%%=*}"
            expected="${pair#*=}"
            actual="$(echo "$pulled_values" | yq -r ".image.digests.${image}")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::published chart's image.digests.${image} is '${actual}', expected '${expected}' — the release does not default to what it claims to pin"
              exit 1
            fi
          done
          echo "Published chart defaults to the resolved digests for all three images"

      # The template is a quoted heredoc so its backticks and ${...} stay
      # literal markdown; the release facts are substituted afterwards. Every
      # substituted value is a semver, a git SHA, an upstream tag or a
      # sha256: digest, none of which can contain the `|` delimiter — and the
      # tag itself is already constrained to `chart-v<Chart.yaml version>` by
      # the pin gate above, so it cannot smuggle one in either.
      - name: Compose the release notes preamble
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          UPSTREAM_TAG: ${{ steps.pin.outputs.upstream_tag }}
          INDISERVER_DIGEST: ${{ steps.digests.outputs.indiserver }}
          DAEMON_DIGEST: ${{ steps.digests.outputs.daemon }}
          WEB_DIGEST: ${{ steps.digests.outputs.web }}
        run: |
          set -euo pipefail
          cat > release-notes.tmpl <<'TEMPLATE'
          ## Install

          ```sh
          helm install allsky oci://ghcr.io/jaxzin/charts/indi-allsky --version @VERSION@
          ```

          Start from [`examples/values-zwo-pi.yaml`](https://github.com/jaxzin/indi-allsky-helm/blob/@TAG@/examples/values-zwo-pi.yaml),
          and read [`docs/host-prep.md`](https://github.com/jaxzin/indi-allsky-helm/blob/@TAG@/docs/host-prep.md)
          before pointing this at real hardware.

          **What "tested" means for this release.** The CI e2e suite installs
          this chart on real Kubernetes clusters and proves the full pipeline —
          NetworkPolicy enforcement, migration/backup lock serialization, the
          overlay checksum barrier, database restore — end to end. It does this
          against upstream's INDI *simulator* driver in disposable `kind`
          clusters, not against physical camera hardware or a production
          cluster. Treat that gap as real until this chart has run on your own
          camera.

          ## What this release pins

          | | |
          | --- | --- |
          | Chart version | `@VERSION@` |
          | Chart commit | [`@COMMIT@`](https://github.com/jaxzin/indi-allsky-helm/commit/@COMMIT@) |
          | Upstream indi-allsky | [`@UPSTREAM_TAG@`](https://github.com/aaronwmorris/indi-allsky/releases/tag/@UPSTREAM_TAG@) |

          ## Image digests — pinned by default in this release

          The published OCI chart (`helm install` command above) already
          defaults to the exact multi-arch manifests below — resolved out of
          the registry by the release workflow and baked into the published
          package's own values, not left for you to `--set`. This is the
          supply-chain protection `image.digests.*` exists for: without it,
          `image.pullPolicy: IfNotPresent` means a node that already cached
          `@UPSTREAM_TAG@` keeps what it cached, while a node pulling for the
          first time gets whatever that mutable tag points at today — two
          nodes in one cluster silently running different code under one
          release. The OCI package removes that by construction; you do not
          need to do anything for it.

          ```yaml
          image:
            digests:
              indiserver: "@INDISERVER_DIGEST@"
              daemon: "@DAEMON_DIGEST@"
              web: "@WEB_DIGEST@"
          ```

          **Consuming the chart from `git` at this commit does not get this
          for free.** The tracked `charts/indi-allsky/values.yaml` stays
          digest-free on purpose, so `main` keeps resolving `:main` for
          day-to-day development — the baking above happens only in the
          release workflow's disposable checkout, never committed. If you
          install from git rather than the OCI chart, copy the block above
          into your own values explicitly.

          ## Consuming this release

          - **Operators** install the OCI chart above — digest-pinned by
            default, nothing further to set.
          - **GitOps** — see
            [`examples/argocd-application.yaml`](https://github.com/jaxzin/indi-allsky-helm/blob/@TAG@/examples/argocd-application.yaml)
            and
            [`examples/flux-helmrelease.yaml`](https://github.com/jaxzin/indi-allsky-helm/blob/@TAG@/examples/flux-helmrelease.yaml)
            (both install the OCI chart, so both get the default above).
          - **Anyone consuming the chart from git** pins `charts/indi-allsky`
            at commit `@COMMIT@`, not at a branch — and sets the digest block
            above explicitly, per the note.

          ## Before production

          Read the
          [credential lifecycle, storage lifecycle, backup protection and
          restore](https://github.com/jaxzin/indi-allsky-helm/blob/@TAG@/docs/configuration.md#credential-lifecycle-and-root-recovery)
          sections. In short: changing a Kubernetes Secret does **not** rotate an
          account in an already-initialized MariaDB datadir, the chart renders no
          automatic restore or root-recovery Job, both PVCs belong to exactly one
          release, and `.sql.gz` dumps are compressed rather than encrypted.

          ---
          TEMPLATE

          # Redirect rather than `sed -i`: BSD sed spells that flag differently,
          # and this step should be runnable by hand on any machine before
          # anyone reaches for a throwaway tag to test it in CI.
          sed \
            -e "s|@VERSION@|${VERSION}|g" \
            -e "s|@TAG@|${GITHUB_REF_NAME}|g" \
            -e "s|@COMMIT@|${GITHUB_SHA}|g" \
            -e "s|@UPSTREAM_TAG@|${UPSTREAM_TAG}|g" \
            -e "s|@INDISERVER_DIGEST@|${INDISERVER_DIGEST}|g" \
            -e "s|@DAEMON_DIGEST@|${DAEMON_DIGEST}|g" \
            -e "s|@WEB_DIGEST@|${WEB_DIGEST}|g" \
            release-notes.tmpl > release-notes.md

          if grep -n '@[A-Z_]*@' release-notes.md; then
            echo "::error::release notes still contain an unsubstituted placeholder"
            exit 1
          fi

          cat release-notes.md

      # `generate_release_notes` appends GitHub's own commit/PR summary AFTER
      # the body above, so the release carries both the facts we recorded and
      # the change list GitHub derives.
      #
      # First release only: a freshly created GHCR package is private, and the
      # pull verification above passes anyway because it uses the credentials it
      # pushed with. The chart package's visibility has to be set to public
      # once, in the GHCR package settings, before anonymous
      # `helm install oci://…` works for anyone else. GitHub exposes no API for
      # it, so it cannot live here — issue #45 owns it.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.pin.outputs.is_prerelease }}
